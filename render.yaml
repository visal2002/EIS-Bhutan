databases:
  - name: eis-db
    databaseName: eis_db
    user: eis_user
    plan: free

services:
  - type: web
    name: eis-backend
    env: python
    buildCommand: "./eis-backend-UAT/build.sh"
    startCommand: "cd eis-backend-UAT && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eis-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-netlify-app.netlify.app" # User needs to change this
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-netlify-app.netlify.app" # User needs to change this
